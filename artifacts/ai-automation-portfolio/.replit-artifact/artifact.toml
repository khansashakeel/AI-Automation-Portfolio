kind = "web"
previewPath = "/"
title = "AI Automation Portfolio"
description = "A cinematic one-page portfolio for an AI and Automation Engineer completing a Master's in Data Science, showcasing projects, capabilities, and contact pathways."
version = "1.0.0"
id = "artifacts/ai-automation-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23124

[services.development]
run = "pnpm --filter @workspace/ai-automation-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ai-automation-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/ai-automation-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23124"
BASE_PATH = "/"
